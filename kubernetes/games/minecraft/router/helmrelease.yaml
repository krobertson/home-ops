---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: mc-router
  values:
    image:
      repository: ghcr.io/itzg/mc-router
      tag: 1.57.1@sha256:0dd5d379e0930a912a96e12e082ff7d379f8dcef874dd9b6eae7c71387279ae2
      pullPolicy: IfNotPresent
    extraArgs:
      - --in-kube-cluster
    services:
      minecraft:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: mc-create.r7n.dev, mc-thermal.r7n.dev
