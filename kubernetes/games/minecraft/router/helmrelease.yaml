---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: mc-router
  values:
    image:
      repository: ghcr.io/itzg/mc-router
      tag: 1.55.0@sha256:0e89cb4e8e1e73f9ccec4211fab5c6b8336bd2768b82b7cca25c6290ed5a2f4a
      pullPolicy: IfNotPresent
    extraArgs:
      - --in-kube-cluster
    services:
      minecraft:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: mc-create.r7n.dev, mc-thermal.r7n.dev
